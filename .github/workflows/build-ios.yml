name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App and Catch Errors
        run: |
          set -o pipefail
          xcodebuild -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcode_build.log || {
              echo "=== 捕获到编译错误，以下是关键报错信息 ==="
              grep -i "error:" xcode_build.log || true
              exit 1
            }

      - name: Package IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "MySSH.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qr MySSH.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: MySSH.ipa
