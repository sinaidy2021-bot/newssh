name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 调试-显示仓库目录结构
        shell: bash
        run: |
          set +e
          {
            echo "=== pwd ==="
            pwd
            echo "=== GITHUB_WORKSPACE 根目录 (深度2) ==="
            find "$GITHUB_WORKSPACE" -maxdepth 2 2>&1
            echo "=== 是否存在 project.yml ==="
            find "$GITHUB_WORKSPACE" -maxdepth 3 -name "project.yml" 2>&1
          } | tee repo-structure.log
          exit 0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -uo pipefail
          {
            if [ ! -f "project.yml" ]; then
              echo "❌ 在仓库根目录 $(pwd) 下找不到 project.yml"
              echo "=== 当前目录内容 ==="
              ls -la
              echo "=== 全仓库范围内搜索 project.yml ==="
              find "$GITHUB_WORKSPACE" -name "project.yml" -print
              exit 1
            fi

            xcodegen generate --spec project.yml
            test -f MySSH.xcodeproj/project.pbxproj
          } 2>&1 | tee xcodegen.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Resolve Swift packages
        run: |
          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -resolvePackageDependencies

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MySSH.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "找不到 MySSH.app，构建失败。"
            echo "=== build 目录 ==="
            find build -maxdepth 6 -print
            exit 1
          fi

          if [ ! -f "$APP_PATH/MySSH" ]; then
            echo "MySSH.app 内没有可执行文件 MySSH。"
            find "$APP_PATH" -maxdepth 2 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"
          file "$APP_PATH/MySSH"

      # 新增步骤：无论上一步成功还是失败都会执行（if: always()）。
      # 把真正的 "error:" 报错行从几千行的原始日志里摘出来，连同上下文一起
      # 写进 GitHub 的 Job Summary —— 这块内容会直接显示在 Actions 运行页面
      # 最上方，markdown 渲染好，手机上不用再展开、翻找原始日志。
      - name: 提取编译错误详情
        if: always()
        shell: bash
        run: |
          set +e
          LOG="build/xcodebuild.log"

          {
            echo "## 🔍 编译错误详情"
            echo ""
            if [ ! -f "$LOG" ]; then
              echo "⚠️ 没有找到构建日志文件（$LOG），说明构建在生成日志之前就失败了，请看上一步 **Build unsigned iOS app** 的原始输出（比如找不到 project.yml、xcodegen 失败等）。"
            else
              # Swift/Xcode 的真实报错都是这种格式：
              #   /path/to/File.swift:12:34: error: xxxxx
              # 这里顺带抓 "BUILD FAILED" 和 "Command ... failed" 这类汇总行
              ERRORS=$(grep -n -E "error:|BUILD FAILED|fatal error:|Command .* failed" "$LOG")

              if [ -z "$ERRORS" ]; then
                echo "未匹配到明确的 \`error:\` 行，可能是签名/配置/环境类问题，下面是日志末尾 80 行供参考："
                echo ""
                echo '```'
                tail -n 80 "$LOG"
                echo '```'
              else
                COUNT=$(echo "$ERRORS" | wc -l | tr -d ' ')
                echo "共匹配到 ${COUNT} 条错误相关行："
                echo ""
                echo '```'
                echo "$ERRORS"
                echo '```'

                echo ""
                echo "### 每条报错的上下文（前后各 2 行）"
                echo '```'
                echo "$ERRORS" | cut -d: -f1 | while read -r lineno; do
                  START=$((lineno>2 ? lineno-2 : 1))
                  END=$((lineno+2))
                  echo "--- 原始日志第 ${lineno} 行附近 ---"
                  sed -n "${START},${END}p" "$LOG"
                  echo ""
                done
                echo '```'

                # 顺便单独存一份精简错误日志，方便下载/搜索
                echo "$ERRORS" > build/errors-only.log
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ipa Payload
          mkdir -p ipa/Payload

          cp -R "build/DerivedData/Build/Products/Release-iphoneos/MySSH.app" ipa/Payload/

          # IPA 本质上是 ZIP，但根目录必须是 Payload/MySSH.app
          cd ipa
          /usr/bin/zip -qry ../MySSH.ipa Payload

          cd ..
          echo "=== IPA 内容检查 ==="
          /usr/bin/unzip -l MySSH.ipa | head -40

          test -s MySSH.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: MySSH.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 汇总所有诊断日志（无论成功失败都会上传）
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp repo-structure.log diagnostics/ 2>/dev/null || true
          cp xcodegen.log diagnostics/ 2>/dev/null || true
          cp build/xcodebuild.log diagnostics/ 2>/dev/null || true
          cp build/errors-only.log diagnostics/ 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-diagnostics
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7
