name: iOS 构建

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          echo "👉 生成 Xcode 工程..."
          xcodegen generate
          echo "✅ 工程生成完毕"

      - name: 解析 Swift Package 依赖
        run: |
          echo "👉 正在解析拉取 Citadel 等依赖..."
          xcodebuild -resolvePackageDependencies -project MySSH.xcodeproj -scheme MySSH

      - name: 构建真机无签名版本 (IPA)
        id: build_step
        run: |
          echo "👉 开始编译真机版本..."
          
          set -o pipefail
          
          # 更改为 iphoneos sdk，并强制关闭所有签名要求
          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" > build_log.txt 2>&1 || BUILD_FAILED=true

          if [ "$BUILD_FAILED" = "true" ]; then
            echo "========================================"
            echo "❌ 编译失败，提取报错内容："
            echo "========================================"
            grep -n -C 3 "error:" build_log.txt | head -n 80 || tail -n 60 build_log.txt
            exit 1
          fi
          
          echo "👉 正在打包生成 .ipa 文件..."
          mkdir -p build/Payload
          # 将编译出的真机 .app 移动到 Payload 目录
          mv build/Build/Products/Release-iphoneos/MySSH.app build/Payload/
          # 压缩成标准 ipa 格式
          cd build
          zip -qr MySSH.ipa Payload/
          echo "🎉 打包成功！"

      - name: 上传失败日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-log
          path: build_log.txt

      - name: 上传 IPA 产物
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-无签名版
          path: build/MySSH.ipa
