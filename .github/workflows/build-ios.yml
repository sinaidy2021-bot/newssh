      - name: Create IPA
        run: |
          set -e

          rm -rf Payload
          rm -f MySSH-unsigned.ipa

          APP_PATH="build/Build/Products/Release-iphoneos/MySSH.app"

          echo "=== Checking APP ==="
          ls -la "$APP_PATH"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: MySSH.app not found"
            exit 1
          fi

          echo "=== Checking Info.plist ==="
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist"

          echo "=== Creating Payload ==="
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          echo "=== Creating IPA ==="
          ditto -c -k --sequesterRsrc --keepParent Payload MySSH-unsigned.ipa

          echo "=== File type ==="
          file MySSH-unsigned.ipa

          echo "=== IPA size ==="
          ls -lh MySSH-unsigned.ipa

          echo "=== ZIP test ==="
          unzip -t MySSH-unsigned.ipa

          echo "=== IPA structure ==="
          unzip -l MySSH-unsigned.ipa | head -50

          echo "=== Checking Payload ==="
          unzip -l MySSH-unsigned.ipa | grep "Payload/MySSH.app"

          echo "=== Extract test ==="
          rm -rf ipa_test
          mkdir ipa_test
          unzip -q MySSH-unsigned.ipa -d ipa_test

          if [ ! -d "ipa_test/Payload/MySSH.app" ]; then
            echo "ERROR: Payload/MySSH.app missing"
            exit 1
          fi

          if [ ! -f "ipa_test/Payload/MySSH.app/Info.plist" ]; then
            echo "ERROR: Info.plist missing"
            exit 1
          fi

          echo "=== IPA verification successful ==="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-unsigned-ipa
          path: MySSH-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
