name: Build iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve packages
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project MySSH.xcodeproj \
            -scheme MySSH

      - name: Build unsigned app
        run: |
          set -e

          rm -rf build

          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            SWIFT_OPTIMIZATION_LEVEL="-Onone" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Create IPA
        run: |
          set -e

          rm -rf Payload
          rm -f MySSH-unsigned.ipa

          APP_PATH="build/Build/Products/Release-iphoneos/MySSH.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: MySSH.app not found!"
            exit 1
          fi

          mkdir -p Payload

          cp -R "$APP_PATH" Payload/MySSH.app

          chmod +x Payload/MySSH.app/MySSH

          cd Payload
          zip -r -9 ../MySSH-unsigned.ipa MySSH.app
          cd ..

          if [ ! -f "MySSH-unsigned.ipa" ]; then
            echo "ERROR: IPA was not created!"
            exit 1
          fi

          echo "=== IPA file ==="
          ls -lh MySSH-unsigned.ipa

          echo "=== IPA contents ==="
          unzip -l MySSH-unsigned.ipa

          echo "=== Testing IPA ==="
          unzip -t MySSH-unsigned.ipa

          echo "=== IPA created successfully ==="

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-unsigned-ipa
          path: MySSH-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
