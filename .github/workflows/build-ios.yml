name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 调试-显示仓库目录结构
        shell: bash
        run: |
          set +e
          {
            echo "=== pwd ==="
            pwd
            echo "=== GITHUB_WORKSPACE 根目录 (深度2) ==="
            find "$GITHUB_WORKSPACE" -maxdepth 2 2>&1
            echo "=== 是否存在 project.yml ==="
            find "$GITHUB_WORKSPACE" -maxdepth 3 -name "project.yml" 2>&1
          } | tee repo-structure.log
          exit 0

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Install XcodeGen
        run: |
          brew update
          brew install xcodegen

      - name: Generate Xcode project
        shell: bash
        run: |
          set -uo pipefail
          {
            if [ ! -f "project.yml" ]; then
              echo "❌ 在仓库根目录 $(pwd) 下找不到 project.yml"
              echo "=== 当前目录内容 ==="
              ls -la
              echo "=== 全仓库范围内搜索 project.yml ==="
              find "$GITHUB_WORKSPACE" -name "project.yml" -print
              exit 1
            fi

            xcodegen generate --spec project.yml
            test -f MySSH.xcodeproj/project.pbxproj
          } 2>&1 | tee xcodegen.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Resolve Swift packages
        run: |
          xcodebuild             -project MySSH.xcodeproj             -scheme MySSH             -sdk iphoneos             -destination 'generic/platform=iOS'             -resolvePackageDependencies

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          xcodebuild             -project MySSH.xcodeproj             -scheme MySSH             -configuration Release             -sdk iphoneos             -destination 'generic/platform=iOS'             -derivedDataPath build/DerivedData             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             CODE_SIGN_IDENTITY=""             build 2>&1 | tee build/xcodebuild.log

          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/MySSH.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "找不到 MySSH.app，构建失败。"
            echo "=== build 目录 ==="
            find build -maxdepth 6 -print
            exit 1
          fi

          if [ ! -f "$APP_PATH/MySSH" ]; then
            echo "MySSH.app 内没有可执行文件 MySSH。"
            find "$APP_PATH" -maxdepth 2 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH"
          file "$APP_PATH/MySSH"

      - name: Package IPA
        shell: bash
        run: |
          set -euo pipefail

          rm -rf ipa Payload
          mkdir -p ipa/Payload

          cp -R "build/DerivedData/Build/Products/Release-iphoneos/MySSH.app" ipa/Payload/

          # IPA 本质上是 ZIP，但根目录必须是 Payload/MySSH.app
          cd ipa
          /usr/bin/zip -qry ../MySSH.ipa Payload

          cd ..
          echo "=== IPA 内容检查 ==="
          /usr/bin/unzip -l MySSH.ipa | head -40

          test -s MySSH.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: MySSH.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

      - name: 汇总所有诊断日志（无论成功失败都会上传）
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          cp repo-structure.log diagnostics/ 2>/dev/null || true
          cp xcodegen.log diagnostics/ 2>/dev/null || true
          cp build/xcodebuild.log diagnostics/ 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-diagnostics
          path: diagnostics
          if-no-files-found: ignore
          retention-days: 7
