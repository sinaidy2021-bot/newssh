name: Build MySSH

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate AppIcon automatically
        shell: bash
        run: |
          set -euo pipefail

          ICON="AppIconSource.png"
          test -f "$ICON"

          rm -rf Assets.xcassets
          mkdir -p Assets.xcassets/AppIcon.appiconset

          cp "$ICON" Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

          cat > Assets.xcassets/Contents.json <<'JSON'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          WIDTH=$(sips -g pixelWidth "$ICON" | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight "$ICON" | awk '/pixelHeight/ {print $2}')
          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"
          echo "AppIcon verified: ${WIDTH}x${HEIGHT}"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated project inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f Info.plist
          test -f Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -f Assets.xcassets/AppIcon.appiconset/Contents.json
          test -f MySSH.xcodeproj/project.pbxproj
          echo "All required build inputs are present."

      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -archivePath build/MySSH.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive | tee build/xcodebuild.log

      - name: 捕获构建错误详情
        if: failure()
        shell: bash
        run: |
          set +e
          LOG="build/xcodebuild.log"

          {
            echo "## 🔍 编译错误详情"
            echo ""

            if [ ! -f "$LOG" ]; then
              echo "⚠️ 没有找到构建日志文件（$LOG）。"
              echo "说明构建可能在生成日志之前就失败了，请查看前一步原始输出。"
              exit 0
            fi

            echo "### 关键错误"
            echo '```text'
            grep -n -E "error:|fatal error:|BUILD FAILED|Command .* failed|SwiftCompile|Ld " "$LOG" | tail -n 120
            echo '```'
            echo ""

            echo "### 最后 200 行原始日志"
            echo '```text'
            tail -n 200 "$LOG"
            echo '```'
          } | tee build/build-error-details.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-build-error-details
          path: |
            build/xcodebuild.log
            build/build-error-details.txt
          if-no-files-found: warn

      - name: Verify archived app
        shell: bash
        run: |
          set -euo pipefail
          APP="build/MySSH.xcarchive/Products/Applications/MySSH.app"
          test -d "$APP"
          test -f "$APP/Info.plist"

          EXECUTABLE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          test "$EXECUTABLE" = "MySSH"
          test -f "$APP/$EXECUTABLE"
          test -x "$APP/$EXECUTABLE"

          FILE_INFO=$(file "$APP/$EXECUTABLE")
          echo "$FILE_INFO"
          echo "$FILE_INFO" | grep -q "Mach-O 64-bit arm64"

          echo "Archive verified: $APP"
          echo "CFBundleExecutable=$EXECUTABLE"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/Payload build/MySSH-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/MySSH.xcarchive/Products/Applications/MySSH.app build/Payload/MySSH.app
          (cd build && zip -qry MySSH-unsigned.ipa Payload)

      - name: Upload IPA and build log
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-unsigned-IPA
          path: |
            build/MySSH-unsigned.ipa
            build/xcodebuild.log
