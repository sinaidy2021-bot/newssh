name: Build iOS App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate --spec project.yml --project .

      - name: Force Xcode Compatibility
        run: |
          # 强制将工程版本降低为当前 Xcode 兼容的 Xcode 14/15 格式 (兼容值 56-60)，避免 format 77 报错
          find MySSH.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' {} +
          find MySSH.xcodeproj -name "project.pbxproj" -exec sed -i '' 's/compatibilityVersion = "Xcode 16.0";/compatibilityVersion = "Xcode 14.0";/g' {} +

      - name: Build and Package IPA
        run: |
          # 编译 App 并输出到 build 目录
          xcodebuild -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          # 打包成标准 IPA
          mkdir -p Payload
          APP_PATH=$(find build -name "MySSH.app" -type d | head -n 1)
          cp -R "$APP_PATH" Payload/
          zip -qr MySSH.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-IPA
          path: MySSH.ipa
