name: MySSH 构建

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: ① 拉取项目
        uses: actions/checkout@v4

      - name: ② 安装 XcodeGen
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen

      - name: ③ 检查项目文件
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "检查 MySSH 项目文件"
          echo "============================================================"

          REQUIRED_FILES=(
            "project.yml"
            "Info.plist"
            "AppIconSource.png"
            "MySSHApp.swift"
            "ContentView.swift"
            "Models.swift"
            "ServerListView.swift"
            "SSHSession.swift"
            "TerminalView.swift"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then
              echo "❌ 缺少文件：$FILE"
              exit 1
            fi
            echo "✅ $FILE"
          done

          echo
          echo "项目文件检查完成。"

      - name: ④ 生成 AppIcon
        shell: bash
        run: |
          set -euo pipefail

          test -f AppIconSource.png

          rm -rf Assets.xcassets
          mkdir -p Assets.xcassets/AppIcon.appiconset

          cp AppIconSource.png \
            Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

          cat > Assets.xcassets/Contents.json <<'JSON'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          WIDTH=$(sips -g pixelWidth AppIconSource.png | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight AppIconSource.png | awk '/pixelHeight/ {print $2}')

          echo "图标尺寸：${WIDTH}x${HEIGHT}"

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

          echo "✅ AppIcon 检查完成。"

      - name: ⑤ 生成 Xcode 项目
        shell: bash
        run: |
          set -euo pipefail

          rm -rf MySSH.xcodeproj

          xcodegen generate

          test -f MySSH.xcodeproj/project.pbxproj

          echo "============================================================"
          echo "Xcode 项目生成成功"
          echo "============================================================"

      - name: ⑥ 检查 Target 源文件
        shell: bash
        run: |
          set -euo pipefail

          echo "============================================================"
          echo "检查 MySSH Target"
          echo "============================================================"

          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -showBuildSettings \
            > build-settings.txt

          echo
          echo "Target：MySSH"
          echo "Scheme：MySSH"

          echo
          echo "Swift 源文件："

          for FILE in \
            MySSHApp.swift \
            ContentView.swift \
            Models.swift \
            ServerListView.swift \
            SSHSession.swift \
            TerminalView.swift
          do
            test -f "$FILE"
            echo "  ✅ $FILE"
          done

          rm -f build-settings.txt

      - name: ⑦ 构建 Archive
        id: archive
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -rf build diagnostics
          mkdir -p build diagnostics

          LOG="build/xcodebuild.log"

          echo "============================================================"
          echo "开始构建 MySSH Archive"
          echo "============================================================"
          echo

          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -archivePath build/MySSH.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee "$LOG"

          STATUS=${PIPESTATUS[0]}

          printf '%s\n' "$STATUS" > diagnostics/exit-code.txt

          echo
          echo "============================================================"
          echo "xcodebuild 退出码：$STATUS"
          echo "============================================================"

          exit "$STATUS"

      - name: ⑧ 生成中文错误诊断
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          LOG="build/xcodebuild.log"
          OUT="diagnostics/中文错误诊断.txt"

          mkdir -p diagnostics

          STATUS="$(cat diagnostics/exit-code.txt 2>/dev/null || echo 1)"

          {
            echo "============================================================"
            echo "MySSH 构建诊断"
            echo "============================================================"
            echo

            echo "【最终结果】"
            echo

            if [ "$STATUS" = "0" ]; then
              echo "✅ 构建成功"
            else
              echo "❌ 构建失败"
            fi

            echo
            echo "xcodebuild 退出码：$STATUS"
            echo

            if [ "$STATUS" != "0" ]; then

              echo "【第一条真正错误】"
              echo

              FIRST_ERROR=""

              if [ -f "$LOG" ]; then

                FIRST_ERROR=$(
                  grep -E \
                    '\.swift:[0-9]+:[0-9]+: (error|fatal error):' \
                    "$LOG" 2>/dev/null \
                  | grep -v '/DerivedData/' \
                  | grep -v 'SwiftDriver' \
                  | head -n 1
                )

                if [ -z "$FIRST_ERROR" ]; then
                  FIRST_ERROR=$(
                    grep -E \
                      '(^|[[:space:]])(error:|fatal error:)' \
                      "$LOG" 2>/dev/null \
                    | grep -v 'SwiftDriver' \
                    | grep -v 'SwiftCompile normal' \
                    | grep -v 'CompileSwiftSources' \
                    | grep -v 'note:' \
                    | head -n 1
                  )
                fi

                if [ -z "$FIRST_ERROR" ]; then
                  FIRST_ERROR=$(
                    grep -E \
                      'clang: error:|ld: error:|Undefined symbols for architecture|duplicate symbol|No such module|Multiple commands produce|PhaseScriptExecution failed' \
                      "$LOG" 2>/dev/null \
                    | head -n 1
                  )
                fi

              fi

              if [ -n "$FIRST_ERROR" ]; then
                echo "$FIRST_ERROR"
              else
                echo "⚠️ 没有自动识别到第一条错误。"
                echo
                echo "下面显示最后 80 行 Xcode 输出："
                echo
                tail -n 80 "$LOG" 2>/dev/null || true
              fi

              echo
              echo "------------------------------------------------------------"
              echo "【全部关键错误】"
              echo "------------------------------------------------------------"
              echo

              if [ -f "$LOG" ]; then

                ERRORS=$(
                  grep -E \
                    '\.swift:[0-9]+:[0-9]+: (error|fatal error):|clang: error:|ld: error:|Undefined symbols for architecture|duplicate symbol|No such module|Multiple commands produce|PhaseScriptExecution failed' \
                    "$LOG" 2>/dev/null \
                  | grep -v '/DerivedData/' \
                  | grep -v 'SwiftDriver' \
                  | awk '!seen[$0]++' \
                  | head -n 20
                )

                if [ -n "$ERRORS" ]; then
                  N=0

                  while IFS= read -r LINE; do
                    [ -z "$LINE" ] && continue
                    N=$((N + 1))
                    echo "$N. $LINE"
                  done <<< "$ERRORS"
                else
                  echo "未找到关键错误。"
                fi

              fi

              echo
              echo "------------------------------------------------------------"
              echo "【自动判断】"
              echo "------------------------------------------------------------"
              echo

              if grep -q "invalid redeclaration" "$LOG" 2>/dev/null; then
                echo "→ 检测到重复声明。重点检查 Target 是否包含重复 Swift 文件。"
              fi

              if grep -q "ambiguous for type lookup" "$LOG" 2>/dev/null; then
                echo "→ 检测到类型定义重复或类型查找歧义。"
              fi

              if grep -q "cannot find .* in scope" "$LOG" 2>/dev/null; then
                echo "→ 检测到未定义变量、函数或类型。"
              fi

              if grep -q "extra argument" "$LOG" 2>/dev/null; then
                echo "→ 检测到函数/初始化器传入多余参数。"
              fi

              if grep -q "missing argument" "$LOG" 2>/dev/null; then
                echo "→ 检测到函数/初始化器缺少参数。"
              fi

              if grep -q "has no member" "$LOG" 2>/dev/null; then
                echo "→ 检测到访问不存在的属性或方法。"
              fi

              if grep -q "No such module" "$LOG" 2>/dev/null; then
                echo "→ 检测到 Swift Package 模块加载失败。"
              fi

              if grep -q "Multiple commands produce" "$LOG" 2>/dev/null; then
                echo "→ 检测到文件/资源重复加入 Target。"
              fi

              if grep -q "Undefined symbols for architecture" "$LOG" 2>/dev/null; then
                echo "→ 检测到链接错误。"
              fi

              if grep -q "PhaseScriptExecution failed" "$LOG" 2>/dev/null; then
                echo "→ 检测到构建脚本失败。"
              fi

              echo
              echo "------------------------------------------------------------"
              echo "完整日志：build/xcodebuild.log"
              echo "------------------------------------------------------------"

            else

              echo
              echo "Archive 构建成功。"

            fi

            echo
            echo "============================================================"

          } > "$OUT"

          cat "$OUT"

      - name: ⑨ 验证 Archive
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          APP="build/MySSH.xcarchive/Products/Applications/MySSH.app"

          echo "检查：$APP"

          test -d "$APP"
          test -f "$APP/Info.plist"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )

          echo "Executable：$EXECUTABLE"

          test "$EXECUTABLE" = "MySSH"
          test -x "$APP/$EXECUTABLE"

          echo "✅ Archive 验证成功。"

      - name: ⑩ 打包 IPA
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          APP="build/MySSH.xcarchive/Products/Applications/MySSH.app"

          rm -rf build/Payload
          rm -f build/MySSH-unsigned.ipa

          mkdir -p build/Payload

          cp -R "$APP" build/Payload/MySSH.app

          cd build

          zip -qry MySSH-unsigned.ipa Payload

          cd ..

          test -f build/MySSH-unsigned.ipa

          echo "✅ IPA 打包成功：build/MySSH-unsigned.ipa"

      - name: ⑪ 上传构建结果
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-构建结果
          path: |
            diagnostics/中文错误诊断.txt
            build/MySSH-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: warn
