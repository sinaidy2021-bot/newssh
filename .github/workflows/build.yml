name: MySSH 构建

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: ① 拉取项目
        uses: actions/checkout@v4

      - name: ② 安装 XcodeGen
        run: brew install xcodegen

      - name: ③ 生成 AppIcon
        shell: bash
        run: |
          set -euo pipefail

          test -f AppIconSource.png

          rm -rf Assets.xcassets
          mkdir -p Assets.xcassets/AppIcon.appiconset

          cp AppIconSource.png \
            Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png

          cat > Assets.xcassets/Contents.json <<'JSON'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          cat > Assets.xcassets/AppIcon.appiconset/Contents.json <<'JSON'
          {
            "images": [
              {
                "filename": "AppIcon-1024.png",
                "idiom": "universal",
                "platform": "ios",
                "size": "1024x1024"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          WIDTH=$(sips -g pixelWidth AppIconSource.png | awk '/pixelWidth/ {print $2}')
          HEIGHT=$(sips -g pixelHeight AppIconSource.png | awk '/pixelHeight/ {print $2}')

          test "$WIDTH" = "1024"
          test "$HEIGHT" = "1024"

      - name: ④ 生成 Xcode 项目
        shell: bash
        run: |
          set -euo pipefail

          rm -rf MySSH.xcodeproj

          xcodegen generate

          test -f MySSH.xcodeproj/project.pbxproj

      - name: ⑤ 构建 Archive
        id: archive
        shell: bash
        run: |
          set +e
          set -o pipefail

          rm -rf build diagnostics
          mkdir -p build diagnostics

          xcodebuild \
            -project MySSH.xcodeproj \
            -scheme MySSH \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            -archivePath build/MySSH.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive \
            2>&1 | tee build/xcodebuild.log >/dev/null

          STATUS=${PIPESTATUS[0]}

          printf '%s\n' "$STATUS" > diagnostics/exit-code.txt

          exit "$STATUS"

      - name: ⑥ 提取真正错误
        if: ${{ always() }}
        shell: bash
        run: |
          set +e

          LOG="build/xcodebuild.log"
          OUT="diagnostics/中文错误诊断.txt"

          STATUS="$(cat diagnostics/exit-code.txt 2>/dev/null || echo 1)"

          {
            echo "============================================================"
            echo "MySSH 构建诊断"
            echo "============================================================"
            echo

            if [ "$STATUS" = "0" ]; then

              echo "【最终结果】"
              echo
              echo "✅ 构建成功"
              echo
              echo "Archive 已成功生成。"

            else

              echo "【最终结果】"
              echo
              echo "❌ 构建失败"
              echo

              echo "【真正错误】"
              echo

              ERRORS=""

              if [ -f "$LOG" ]; then

                # ------------------------------------------------
                # 第一优先级：
                # 只抓 MySSH 自己源码的 Swift 编译错误
                # ------------------------------------------------

                ERRORS=$(
                  grep -E \
                    '/(SSHSession|TerminalView|ServerListView|Models|ContentView|MySSHApp)\.swift:[0-9]+:[0-9]+: (error|fatal error):' \
                    "$LOG" 2>/dev/null \
                  | sed -E 's/^[0-9]+://' \
                  | sed -E 's/^[[:space:]]+//' \
                  | awk '!seen[$0]++' \
                  | head -n 12
                )

                # ------------------------------------------------
                # 第二优先级：
                # 模块、链接、重复文件、签名等真正错误
                # ------------------------------------------------

                if [ -z "$ERRORS" ]; then
                  ERRORS=$(
                    grep -E \
                      'clang: error:|ld: error:|Undefined symbols for architecture|duplicate symbol|No such module|Multiple commands produce|Code signing is required|requires a provisioning profile|Provisioning profile|PhaseScriptExecution failed' \
                      "$LOG" 2>/dev/null \
                    | sed -E 's/^[0-9]+://' \
                    | sed -E 's/^[[:space:]]+//' \
                    | awk '!seen[$0]++' \
                    | head -n 12
                  )
                fi

                # ------------------------------------------------
                # 第三优先级：
                # Xcode 编译器明确给出的 error
                # 但排除 SwiftDriver / dependency 流水账
                # ------------------------------------------------

                if [ -z "$ERRORS" ]; then
                  ERRORS=$(
                    grep -E \
                      '(^|[[:space:]])(error:|fatal error:)' \
                      "$LOG" 2>/dev/null \
                    | grep -v 'SwiftDriver' \
                    | grep -v 'SwiftCompile normal' \
                    | grep -v 'CompileSwiftSources' \
                    | grep -v 'note:' \
                    | sed -E 's/^[0-9]+://' \
                    | sed -E 's/^[[:space:]]+//' \
                    | awk '!seen[$0]++' \
                    | head -n 12
                  )
                fi

                if [ -n "$ERRORS" ]; then
                  N=0

                  while IFS= read -r line; do
                    [ -z "$line" ] && continue

                    N=$((N + 1))

                    echo "$N. $line"

                  done <<< "$ERRORS"

                else

                  echo "未提取到明确的源码错误。"
                  echo "请查看 Artifact 中的完整日志：build/xcodebuild.log"

                fi

              else

                echo "没有找到 Xcode 构建日志。"

              fi

              echo
              echo "【对应解决方案】"
              echo

              if [ -f "$LOG" ]; then

                if grep -q "cannot find .* in scope" "$LOG"; then
                  echo "→ 存在未定义的变量、函数或类型。检查声明、拼写和文件是否完整。"
                fi

                if grep -q "extra argument" "$LOG"; then
                  echo "→ 调用传入了多余参数。按照当前函数/初始化器定义删除多余参数。"
                fi

                if grep -q "missing argument" "$LOG"; then
                  echo "→ 调用缺少参数。按照当前函数/初始化器定义补齐参数。"
                fi

                if grep -q "has no member" "$LOG"; then
                  echo "→ 当前类型没有该属性或方法。检查成员名称及类型定义。"
                fi

                if grep -q "ambiguous use" "$LOG"; then
                  echo "→ 调用存在歧义。检查重复声明、重载以及类型推断。"
                fi

                if grep -q "No such module" "$LOG"; then
                  echo "→ 缺少模块。检查 project.yml 中的 Swift Package 依赖和 product 名称。"
                fi

                if grep -q "Multiple commands produce" "$LOG"; then
                  echo "→ 文件被重复加入 Target。检查 sources、resources 和 INFOPLIST_FILE。"
                fi

                if grep -q "Undefined symbols for architecture" "$LOG"; then
                  echo "→ 链接失败。检查 Swift Package、Target 依赖和链接库。"
                fi

                if grep -q "ld: error:" "$LOG"; then
                  echo "→ 链接阶段失败。检查依赖库及 Target Link Binary With Libraries。"
                fi

                if grep -q "Code signing is required\|requires a provisioning profile\|Provisioning profile" "$LOG"; then
                  echo "→ 签名配置问题。检查 CODE_SIGNING_ALLOWED、CODE_SIGNING_REQUIRED 和签名设置。"
                fi

                if grep -q "PhaseScriptExecution failed" "$LOG"; then
                  echo "→ 构建脚本失败。检查该脚本产生的第一条实际 error。"
                fi

              fi

              echo
              echo "完整 Xcode 日志已保存到 Artifact："
              echo "build/xcodebuild.log"

            fi

            echo
            echo "============================================================"

          } > "$OUT"

          cat "$OUT"

      - name: ⑦ 验证 Archive
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          APP="build/MySSH.xcarchive/Products/Applications/MySSH.app"

          test -d "$APP"
          test -f "$APP/Info.plist"

          EXECUTABLE=$(
            /usr/libexec/PlistBuddy \
              -c 'Print :CFBundleExecutable' \
              "$APP/Info.plist"
          )

          test "$EXECUTABLE" = "MySSH"
          test -x "$APP/$EXECUTABLE"

      - name: ⑧ 打包 IPA
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail

          APP="build/MySSH.xcarchive/Products/Applications/MySSH.app"

          rm -rf build/Payload
          rm -f build/MySSH-unsigned.ipa

          mkdir -p build/Payload

          cp -R "$APP" build/Payload/MySSH.app

          (
            cd build
            zip -qry MySSH-unsigned.ipa Payload
          )

          test -f build/MySSH-unsigned.ipa

      - name: ⑨ 上传构建结果
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MySSH-构建结果与简洁诊断
          path: |
            diagnostics/中文错误诊断.txt
            build/MySSH-unsigned.ipa
            build/xcodebuild.log
          if-no-files-found: warn
