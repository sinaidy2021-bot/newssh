name: MySSH
options:
  bundleIdPrefix: com.myssh
  xcodeVersion: "15.0"
targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["."]
    excludes:
      - "README.md"
      - "一键构建说明.txt"
      - ".github"
      - "Info.plist"
      - "build_log.txt"
    dependencies:
      - package: Citadel
    settings:
      base:
        PRODUCT_NAME: "MySSH"
        PRODUCT_BUNDLE_IDENTIFIER: "com.myssh.app"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        INFOPLIST_KEY_CFBundleDisplayName: "MySSH"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
