name: MySSH
options:
  bundleIdPrefix: com.myssh
  xcodeVersion: "15.0"
targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["."]
    excludes: ["README.md", "一键构建说明.txt", ".github"]
    info:
      path: Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myssh.app
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - package: Citadel
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
