name: MySSH

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    INFOPLIST_FILE: Info.plist

targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
        excludes:
          - ".github/**"
          - "README.md"
          - "project.yml"
    info:
      path: Info.plist
    dependencies:
      - package: Citadel
        product: Citadel
      - package: swift-nio
        product: NIOCore
      - package: swift-nio-ssh
        product: NIOSSH

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    branch: main
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"
  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: "0.3.4"
