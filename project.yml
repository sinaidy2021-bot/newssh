name: MySSH
options:
  bundleIdPrefix: com.myssh
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"

packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.12.0

targets:
  MySSH:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "*.md"
          - "*.yml"
          - ".github/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myssh.terminal
        SWIFT_VERSION: "6.0"
        INFOPLIST_FILE: Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Citadel
        product: Citadel
    scheme:
      gatherCoverageData: false
