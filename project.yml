name: SSHBlack
options:
  bundleIdPrefix: com.myssh
  xcodeVersion: "15.0"
targets:
  SSHBlack:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: ["."]
    excludes: ["README.md", "一键构建说明.txt", ".github", "Info.plist"]
    info:
      path: Info.plist  # 补回这个 XcodeGen 强依赖的字段
      properties:
        CFBundleDisplayName: "MySSH"
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myssh.app
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
dependencies:
  - package: Citadel
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.9.0"
