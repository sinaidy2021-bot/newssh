name: MySSH
options:
  bundleIdPrefix: com.myssh
targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - ContentView.swift
      - MySSHApp.swift
      - SSHSession.swift
      - TerminalView.swift
      - ServerListView.swift
      - Models.swift
    info:
      path: Info.plist
      properties: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.myssh.app
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
