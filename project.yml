name: MySSH

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: "NO"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: .
        excludes:
          - ".github/**"
          - ".git/**"
          - "build/**"
          - "diagnostics/**"
          - "DerivedData/**"
          - "Info.plist"
          - "project.yml"
          - "project.yaml"
          - "README.md"
          - "*.zip"
          - "*.log"
          - "打包说明.txt"
          - "AppIconSource.png"

    resources:
      - path: Assets.xcassets

    dependencies:
      - package: SwiftTerm
        product: SwiftTerm
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
      - package: swift-nio-ssh
        product: NIOSSH

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: "1.15.0"

  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.81.0"

  swift-nio-ssh:
    url: https://github.com/Wellz26/swift-nio-ssh.git
    from: "0.3.4"
