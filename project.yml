name: MySSH
options:
  bundleIdPrefix: com.example
targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: .
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Citadel
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    branch: main
