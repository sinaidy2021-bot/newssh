name: MySSH
options:
  bundleIdPrefix: com.example
targets:
  MySSH:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
    dependencies:
      - package: Citadel
      - package: swift-nio
        product: NIOCore
      - package: swift-nio
        product: NIOPosix
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    branch: main
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    from: "2.65.0"
